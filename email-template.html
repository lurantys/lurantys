<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .button {
      display: inline-block;
      padding: 12px 24px;
      margin: 8px 4px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      text-decoration: none;
      color: #ffffff;
      background-color: #3b99fc;
    }
    .button:hover {
      background-color: #2c85ec;
    }
  </style>
</head>
<body>
  <div style="text-align: center; font-family: Arial, sans-serif;">
    <a href="https://github.com" class="button">Portfolio</a>
    <a href="https://hanamanga.example.com" class="button">Hanamanga</a>
    <a href="mailto:" class="button"><img src="gmail.png" alt="Gmail" style="vertical-align: middle; margin-right: 8px; height: 24px;"> Gmail</a>
  </div>
</body>
</html>
